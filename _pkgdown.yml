url: https://jobnmadu.github.io/Dyn4cast/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "gold"
    secondary: "forestgreen"

articles:
  - title: "Tutorials"
    desc: "Vignettes introducing various functions in the package"

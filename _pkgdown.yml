      - Dyn4cast

  - title: "Getting started"
    desc: "Installation and onboarding"
    contents:
      - Starting

reference:

  - title: corplot
    desc: Custom plot of correlation matrix

  - title: DynamicForecast
    desc: Dynamic Forecast of Five Models and their Ensembles

  - title: estimate_plot
    desc: Plot of Order of Significance of Estimated Regression Coefficients

  - title: formattedcut
    desc: Convert continuous vector variable to formatted factors

  - title: garrett_ranking
    desc: Garrett Ranking of Categorical Data

  - title: gender
    desc: Create Gender Variable

  - title: index_construction
    desc: Index Construction for estimation of *Exposure* or *Sensitivity*

  - title: Linearsystems
    desc: Linear Model and various Transformations for Efficiency

  - title: MallowsCP
    desc:  Computation of MallowsCp

  - title: mdi
    desc:  Sequential Computation of Dynamic Multidimensional Indices (MDI)

  - title: MLMetrics
    desc:  Collection of Machine Learning Model Metrics for Easy Reference

  - title: model_factors
    desc:  Latent Factors Recovery from Variables Loadings

  - title: odds_summary
    desc:  Odds-Based Measures for Binary and Categorical Models

